<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>특이점에서 우주까지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow reading column floating over a live particle sky; the era colour tints everything. */
:root{
  --void:#07060b;
  --ink:#ece8f4;
  --muted:#a49db6;
  --faint:#6d6680;
  --panel:rgba(18,15,28,.72);
  --line:rgba(236,232,244,.13);
  --era:#fff2d8;
  --danger:#ff7a6b;
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
#app{position:relative;z-index:1;max-width:680px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--era);outline-offset:3px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--era);margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;line-height:1.25}

/* title */
.title{display:flex;flex-direction:column;gap:20px;padding-top:9vh}
.title h1{font-size:clamp(44px,11vw,84px);line-height:1.08;letter-spacing:-.01em}
.title h1 span{color:var(--era)}
.lede{color:var(--muted);max-width:34em;margin:0;font-size:17px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.btn{background:var(--era);color:#120f18;border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:16px;transition:transform .15s,filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.ghost{background:transparent;border:1px solid var(--line);border-radius:999px;padding:13px 22px;color:var(--ink);font-size:15px}
.ghost:hover{border-color:var(--era)}
.meta{font-family:var(--f-mono);font-size:12.5px;color:var(--faint);margin:0;letter-spacing:.03em}
.epochs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px 18px;margin:8px 0 0;padding:0;list-style:none;font-size:13px;color:var(--muted)}
.epochs li{display:flex;gap:8px;min-width:0}
.epochs b{font-family:var(--f-mono);font-weight:400;color:var(--faint);min-width:5.2em;font-size:12px;padding-top:1px}

/* timeline */
.tl{display:flex;gap:4px;align-items:center}
.tl i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.tl i.done{background:color-mix(in srgb,var(--era) 55%,transparent)}
.tl i.now{background:var(--era);box-shadow:0 0 10px var(--era)}
.hud{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hud .meta b{color:var(--ink);font-weight:500}

/* era */
.era{display:flex;flex-direction:column;gap:14px}
.era h2{font-size:clamp(32px,7.5vw,50px)}
.readout{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-mono);font-size:12.5px;padding:5px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--muted);font-variant-numeric:tabular-nums}
.chip em{font-style:normal;color:var(--ink)}
.desc{margin:0;font-size:16.5px;color:var(--ink);max-width:36em;background:var(--panel);padding:16px 18px;border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

/* choices */
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:border-color .15s,transform .15s,background .15s}
.choice:hover{border-color:var(--era);transform:translateX(3px)}
.choice .k{font-family:var(--f-mono);font-size:13px;color:var(--era);border:1px solid color-mix(in srgb,var(--era) 45%,transparent);border-radius:50%;width:30px;height:30px;display:grid;place-items:center}
.choice .t{font-weight:600;font-size:16px;display:block;line-height:1.45}
.choice .s{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:3px}

/* result */
.result{display:flex;flex-direction:column;gap:14px;background:var(--panel);border:1px solid color-mix(in srgb,var(--era) 40%,transparent);border-radius:14px;padding:18px 20px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);animation:rise .45s ease both}
.result h3{font-size:21px}
.result p{margin:0}
.sage{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;padding:12px;border-radius:10px;background:color-mix(in srgb,var(--era) 9%,transparent);border:1px dashed color-mix(in srgb,var(--era) 45%,transparent)}
.sage .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:19px;background:var(--era);color:#120f18}
.sage small{display:block;font-family:var(--f-mono);font-size:11.5px;color:var(--era);letter-spacing:.08em}
.sage b{font-weight:600}
.sage span{display:block;font-size:13.5px;color:var(--muted);line-height:1.55}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}

/* gauges */
.gauges{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.g{display:flex;flex-direction:column;gap:5px;min-width:0}
.g label{font-size:11.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .bar{height:5px;border-radius:3px;background:var(--line);position:relative;overflow:hidden}
.g .bar i{position:absolute;top:0;bottom:0;left:0;background:var(--era);border-radius:3px;filter:blur(1.2px);transition:width .6s ease}
.gnote{font-size:12px;color:var(--faint);margin:-4px 0 0}

/* ending */
.end{display:flex;flex-direction:column;gap:18px;padding-top:4vh}
.end h1{font-size:clamp(40px,10vw,72px)}
.fate{display:inline-flex;align-self:flex-start;font-family:var(--f-mono);font-size:13px;padding:5px 12px;border-radius:999px;background:var(--era);color:#120f18;font-weight:500}
.story{font-size:17px;margin:0;max-width:36em}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel h3{font-size:17px;margin-bottom:10px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0;font-variant-numeric:tabular-nums}
.spec dt{color:var(--muted);font-size:14px}
.spec dd{margin:0;font-family:var(--f-mono);font-size:14px;text-align:right}
.sim{display:flex;align-items:center;gap:12px;margin-top:12px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.sim .bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.sim .bar i{display:block;height:100%;background:var(--era)}
.path{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.path li{display:grid;grid-template-columns:7.5em 1fr;gap:10px;min-width:0}
.path li b{font-family:var(--f-mono);font-weight:400;font-size:12px;color:var(--faint);padding-top:2px}
.epi{margin:0;padding-left:14px;border-left:2px solid var(--era);color:var(--muted);font-size:15px;display:flex;flex-direction:column;gap:8px}
.epi p{margin:0}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dexgrid div{padding:10px 12px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;min-width:0}
.dexgrid div.on{border-color:color-mix(in srgb,var(--era) 50%,transparent);background:color-mix(in srgb,var(--era) 8%,transparent)}
.dexgrid div small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.dexgrid div.off{color:var(--faint)}
.warp{font-family:var(--f-display);font-size:24px;text-align:center;padding-top:30vh;color:var(--era)}

@media (max-width:480px){
  .gauges{grid-template-columns:repeat(5,1fr);gap:6px}
  .g label{font-size:10.5px}
  .path li{grid-template-columns:1fr;gap:0}
  .choice{grid-template-columns:28px 1fr;padding:12px 14px}
  .choice .k{width:26px;height:26px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.term{margin:0;font-size:14.5px;color:var(--muted);padding:10px 14px;border-radius:10px;border:1px dashed color-mix(in srgb,var(--era) 40%,transparent)}
.term b{color:var(--era);font-weight:600;margin-right:6px}
.choice .h{display:block;font-size:12.5px;color:var(--era);margin-top:5px;opacity:.9}
.tog{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--era)}
.howto{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.howto h3{font-size:17px;margin-bottom:6px}
.howto ol{margin:0;padding-left:20px;color:var(--muted);font-size:14.5px;display:flex;flex-direction:column;gap:4px}
.screen{display:flex;flex-direction:column;gap:18px;padding-top:6vh;animation:rise .45s ease both}
.big{font-size:clamp(30px,7.5vw,46px)}
.screen.event .eyebrow{font-size:13px}
.screen.event .big{color:var(--era)}
.dchips{display:flex;flex-wrap:wrap;gap:8px}
.dchip{font-size:14px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04)}
.dchip.ok{border-color:rgba(110,240,170,.5);color:#a8f5c8}
.dchip.warn{border-color:rgba(255,140,110,.6);color:#ffb3a0}
.gauges{grid-template-columns:repeat(3,1fr)!important;gap:12px 14px!important}
.g label{display:flex;justify-content:space-between;gap:4px;font-size:12.5px!important;color:var(--muted)!important}
.g label span{font-size:10.5px;padding:0 6px;border-radius:999px}
.g label .ok{color:#a8f5c8;background:rgba(110,240,170,.12)}
.g label .warn{color:#ffb3a0;background:rgba(255,120,90,.14)}
.g .bar{height:8px!important;overflow:visible!important}
.g .bar b{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.18);border-radius:3px}
.g .bar i{position:absolute;top:-3px;bottom:-3px;width:4px!important;border-radius:2px;background:var(--era);filter:none!important;box-shadow:0 0 8px var(--era);transition:left .6s ease!important}
.miles{display:flex;flex-wrap:wrap;gap:8px}
.miles span{font-size:14px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);color:var(--faint)}
.miles span.on{border-color:var(--era);color:var(--ink);background:color-mix(in srgb,var(--era) 14%,transparent)}
.spec dt small{display:block;font-size:11.5px;color:var(--faint)}
.spec dd{align-self:center}
.path li.evt span{color:#ffd84a}
.stopnote{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:12px;border:1px solid var(--danger);background:rgba(255,90,70,.12)}
.stopnote b{color:var(--danger);font-weight:600}
.stopnote span{font-size:14.5px;color:var(--ink)}
.term{background:var(--panel);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.screen .story{background:var(--panel);padding:16px 18px;border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.gauges{background:var(--panel);padding:12px 14px;border-radius:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}


.choice .k{align-self:center}
.thumb{width:104px;height:72px;border-radius:8px;border:1px solid var(--line);display:block}
.vis{margin:0;display:flex;flex-direction:column;gap:8px}
.vis canvas{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:14px;border:1px solid color-mix(in srgb,var(--era) 35%,transparent);display:block;background:#05040a}
.vis figcaption{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.replay{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink);white-space:nowrap}
.replay:hover{border-color:var(--era)}

/* 학자 카드: 누르면 주장 설명 */
.sage{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,background .15s}
.sage:hover{background:color-mix(in srgb,var(--era) 15%,transparent);border-style:solid}
.sage .more{display:block;margin-top:4px;font-family:var(--f-mono);font-size:11.5px;color:var(--era);letter-spacing:.04em}
.dexgrid button.on{padding:10px 12px;border-radius:10px;font-size:13.5px;min-width:0;text-align:left;border:1px solid color-mix(in srgb,var(--era) 50%,transparent);background:color-mix(in srgb,var(--era) 8%,transparent);line-height:1.5}
.dexgrid button.on:hover{background:color-mix(in srgb,var(--era) 18%,transparent)}
.dexgrid button.on small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
.dexhint{margin:-4px 0 10px;font-size:13px;color:var(--faint)}
dialog.sagebox{max-width:min(560px,calc(100vw - 32px));width:100%;padding:0;border:1px solid color-mix(in srgb,var(--era) 45%,transparent);border-radius:16px;background:#14111e;color:var(--ink)}
dialog.sagebox::backdrop{background:rgba(5,4,10,.72);backdrop-filter:blur(3px)}
.sagebox .in{padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 64px);overflow:auto}
.sagebox .hd{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center}
.sagebox .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:22px;background:var(--era);color:#120f18}
.sagebox small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--era);letter-spacing:.08em}
.sagebox h2{font-size:22px}
.sagebox .claim{margin:0;padding:12px 14px;border-radius:10px;background:color-mix(in srgb,var(--era) 10%,transparent);border-left:3px solid var(--era);font-family:var(--f-display);font-size:17px;line-height:1.5}
.sagebox .claim b{display:block;font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--era);letter-spacing:.08em;margin-bottom:2px}
.sagebox p{margin:0;font-size:15.5px;line-height:1.75}
.sagebox .verdict{align-self:flex-start;font-family:var(--f-mono);font-size:12.5px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.sagebox .close{align-self:flex-end}
</style>

<canvas id="sky" aria-hidden="true"></canvas>
<main id="app" aria-live="polite"></main>
<dialog class="sagebox" id="sagebox" aria-labelledby="sagebox-name"></dialog>

<script>
(()=>{
// ---------- 학자 카드 ----------
const SAGES={
  penrose:{n:"펜로즈 · 호킹",y:"1965–1970",d:"시간을 거꾸로 돌리면 우주는 한 점(특이점)에서 시작해야 한다는 것을 수학으로 보였어요.",c:"시간을 거꾸로 돌리면 우주는 한 점에서 시작해야 한다",t:"펜로즈는 무거운 별이 무너져 블랙홀이 되면, 그 한가운데에 밀도가 끝없이 큰 점(특이점)이 반드시 생긴다는 것을 수학으로 증명했어요. 호킹은 이 생각을 우주 전체에 거꾸로 적용했어요. 우주가 지금 커지고 있으니, 시간을 되감으면 모든 것이 한 점으로 모인다는 거예요. 다만 그 점에서는 지금의 물리 법칙이 통하지 않아서, 정말 '점'이었는지는 아직 아무도 몰라요.",v:"수학으로 증명됨 · 그 순간은 아직 수수께끼"},
  hawking:{n:"스티븐 호킹",y:"1974",d:"블랙홀도 아주 천천히 빛을 내며 증발한다는 '호킹 복사'를 발견했어요.",c:"블랙홀도 빛을 내며 증발한다",t:"블랙홀은 무엇이든 빨아들이고 아무것도 내보내지 않는다고 여겨졌어요. 호킹은 아주 작은 세계의 법칙(양자역학)을 함께 쓰면 블랙홀 가장자리에서 아주 약한 빛이 새어 나온다는 것을 계산했어요. 빛이 나가는 만큼 블랙홀은 조금씩 가벼워지고, 아주 작은 블랙홀은 결국 '펑' 하고 사라져요. 큰 블랙홀은 증발하는 데 우주 나이보다 훨씬 오래 걸려서 아직 직접 보지는 못했어요.",v:"널리 인정받음 · 관측은 아직"},
  guth:{n:"앨런 구스",y:"1980",d:"우주가 태어나자마자 순식간에 부풀었다는 '인플레이션' 이론을 처음 제안했어요.",c:"태어나자마자 우주가 순식간에 엄청나게 부풀었다",t:"빅뱅 이론에는 풀리지 않던 수수께끼가 있었어요. 한 번도 만난 적 없는 하늘 반대편끼리 온도가 똑같은 이유, 우주가 이상할 만큼 평평한 이유예요. 구스는 탄생 직후 아주 짧은 순간에 우주가 엄청나게 부풀었다면 둘 다 풀린다고 했어요. 아주 작은 한 곳이 부풀어 온 하늘이 됐으니 온도가 같고, 풍선을 크게 불면 표면이 평평해 보이는 것처럼 우주도 평평해진 거예요.",v:"지금 가장 널리 받아들여지는 설명"},
  linde:{n:"안드레이 린데",y:"1983–1986",d:"인플레이션이 어딘가에서는 영원히 계속되어 수많은 거품 우주가 생긴다고 했어요.",c:"인플레이션은 영원히 계속되며 거품 우주를 끝없이 만든다",t:"린데는 인플레이션이 모든 곳에서 한꺼번에 멈추지 않는다고 생각했어요. 어떤 곳은 멈춰서 우리 우주 같은 '거품'이 되고, 그 바깥은 계속 부풀며 새 거품을 끝없이 만들어요. 그러면 우주는 하나가 아니라 수많은 거품 우주의 바다(다중우주)가 돼요. 다른 거품은 볼 수 없어서 확인할 방법이 없다는 것이 가장 큰 숙제예요.",v:"확인할 방법이 아직 없음"},
  dicke:{n:"로버트 디키",y:"1969",d:"우주가 지금처럼 평평하려면 처음 밀도가 엄청나게 정확해야 한다는 수수께끼를 지적했어요.",c:"지금처럼 평평하려면 처음 밀도가 소름 돋게 정확해야 한다",t:"우주 밀도가 기준(임계밀도)보다 조금만 크면 금방 다시 쪼그라들고, 조금만 작으면 너무 빨리 흩어져요. 그런데 지금 우주는 기준에 아주 가까워요. 디키가 거꾸로 계산해 보니 탄생 1초 때 밀도가 기준과 거의 털끝만큼도 달라서는 안 됐어요. 연필을 뾰족한 끝으로 세워 수십억 년을 버티게 한 셈이에요. 이 '평탄성 문제'의 답으로 나중에 인플레이션이 나왔어요.",v:"좋은 질문이었음 · 인플레이션이 답으로 나옴"},
  sakharov:{n:"안드레이 사하로프",y:"1967",d:"물질이 반물질보다 조금 더 남으려면 필요한 세 가지 조건을 정리했어요.",c:"물질이 반물질보다 더 남으려면 세 가지 조건이 필요하다",t:"빅뱅에서는 물질과 반물질이 같은 양으로 생겨서 모두 만나 빛으로 사라져야 할 것 같아요. 그런데 우리는 물질로 된 세상에 살고 있죠. 사하로프는 물질이 조금 더 남으려면 ① 물질의 개수가 바뀔 수 있어야 하고 ② 물질과 반물질이 아주 조금 다르게 행동해야 하고 ③ 우주가 빨리 식어 균형이 깨져야 한다고 정리했어요. 실험에서 흔적은 찾았지만 지금 남은 양을 다 설명하지는 못해요.",v:"조건은 인정 · 정확한 방법은 아직 몰라요"},
  higgs:{n:"피터 힉스 외",y:"1964",d:"공간을 채운 장이 알갱이에 질량을 준다고 예측했어요. 48년 뒤 힉스 입자가 발견됐어요.",c:"공간을 채운 '힉스 장'이 알갱이에 질량을 준다",t:"힉스와 다른 과학자들은 우주 공간 전체에 보이지 않는 장이 깔려 있다고 했어요. 알갱이가 이 장 속을 지나갈 때 많이 붙잡힐수록 무거워져요. 빛(광자)은 전혀 붙잡히지 않아서 질량이 없어요. 장이 정말 있다면 세게 두드렸을 때 튀어나오는 알갱이(힉스 입자)도 있어야 한다고 예측했어요. 48년 뒤 정말 발견돼 2013년 노벨상을 받았어요.",v:"사실로 확인됨"},
  lhc:{n:"CERN LHC",y:"2012",d:"세계 최대 입자가속기에서 힉스 입자를 찾아냈어요.",c:"힉스 입자를 찾았고, 우리 진공은 '아슬아슬'할 수도 있다",t:"스위스와 프랑스 땅속에 둘레 27km의 고리 모양 가속기가 있어요. 양성자를 빛에 가까운 속도로 돌려 정면으로 부딪히면 잠깐 동안 빅뱅 직후처럼 뜨거워져요. 2012년 여기서 힉스 입자를 찾았어요. 그 질량으로 계산해 보면 우리 우주의 진공이 가장 깊은 바닥이 아니라 '얕은 골짜기'에 있을 수도 있어요. 다만 굴러떨어지려면 우주 나이보다 훨씬 오래 걸린다고 해요.",v:"발견은 사실 · 진공 이야기는 아직 확실하지 않아요"},
  zwicky:{n:"츠비키 · 베라 루빈",y:"1933 · 1970년대",d:"은하들이 너무 빨리 도는 것을 보고 '보이지 않는 물질'이 있다고 생각했어요.",c:"눈에 보이지 않는 '암흑물질'이 있다",t:"츠비키는 은하 무리 속 은하들이 너무 빨리 움직이는 것을 보았어요. 보이는 별의 무게만으로는 붙잡아 둘 수 없을 만큼 빨랐죠. 그래서 보이지 않는 물질이 있다고 했어요. 베라 루빈은 은하 가장자리 별들이 중심 쪽 별만큼 빨리 도는 것을 정밀하게 재서, 은하마다 보이지 않는 물질이 감싸고 있다는 것을 보여 줬어요. 보통 물질보다 5배쯤 많지만 정체는 아직 몰라요.",v:"있다는 건 인정 · 정체는 모름"},
  gamow:{n:"앨퍼 · 가모프",y:"1948",d:"뜨거운 초기 우주에서 수소와 헬륨이 만들어졌다고 계산하고, 그 빛이 아직 남아 있을 거라 예언했어요.",c:"뜨거운 초기 우주가 수소와 헬륨을 만들었고, 그 빛이 아직 남아 있다",t:"앨퍼와 가모프는 초기 우주가 아주 뜨겁고 빽빽했다면 처음 몇 분 동안 거대한 핵융합 공장이 됐을 거라고 계산했어요. 그 결과 우주는 무게로 수소 약 75%, 헬륨 약 25%가 돼요. 또 그때의 뜨거운 빛이 우주가 커지며 식어 지금은 아주 차가운 전파로 하늘에 남아 있을 거라고 예언했어요. 두 예측이 모두 맞아서 빅뱅 이론의 가장 강한 증거가 됐어요.",v:"관측으로 확인됨"},
  hoyle:{n:"프레드 호일",y:"1949",d:"'빅뱅'이라는 이름을 붙인 사람이에요. 사실은 빅뱅 이론을 놀리려고 지은 이름이었어요.",c:"원소는 빅뱅이 아니라 모두 별 속에서 만들어진다",t:"호일은 우주에 시작이 있다는 생각을 믿지 않았어요. 1949년 라디오 방송에서 그 생각을 '빅뱅(큰 쾅)'이라고 불렀는데, 그 이름이 그대로 굳어졌어요. 호일은 처음 몇 분 동안 원소가 생긴 게 아니라 모든 원소를 별이 만든다고 봤어요. 탄소나 산소 같은 무거운 원소는 호일 말이 맞았지만, 우주의 헬륨 25%는 별만으로는 다 만들 수 없다는 것이 밝혀졌어요.",v:"절반만 맞음 · 헬륨은 빅뱅이 만들었어요"},
  penzias:{n:"펜지어스 · 윌슨",y:"1965",d:"안테나의 지워지지 않는 잡음이 빅뱅의 남은 빛이라는 것을 우연히 발견했어요.",c:"하늘 전체에서 오는 잡음은 빅뱅의 남은 빛이다",t:"1964년 펜지어스와 윌슨은 나팔 모양 큰 안테나로 전파를 재다가 어느 쪽을 향해도 사라지지 않는 잡음을 들었어요. 안테나에 둥지를 튼 비둘기까지 쫓아내고 청소했지만 잡음은 그대로였어요. 알고 보니 하늘 전체에서 오는 영하 270도쯤의 전파, 바로 가모프 팀이 예언한 빅뱅의 남은 빛(우주배경복사)이었어요. 두 사람은 1978년 노벨상을 받았어요.",v:"관측으로 확인됨"},
  friedmann:{n:"알렉산드르 프리드만",y:"1922",d:"아인슈타인의 식에서 우주가 커지거나 줄어들 수 있다는 답을 처음 찾았어요.",c:"우주는 가만히 있지 않고 커지거나 줄어들 수 있다",t:"아인슈타인은 우주가 변하지 않는다고 믿었어요. 그런데 프리드만이 아인슈타인의 중력 식을 풀어 보니 우주가 커지거나 줄어드는 답이 자연스럽게 나왔어요. 물질이 많으면 공처럼 닫혀 언젠가 다시 쪼그라들고, 적으면 영원히 커져요. 아인슈타인은 처음엔 계산이 틀렸다고 했다가 나중에 인정했어요. 이 식은 지금도 우주론의 기본 식이에요.",v:"지금도 우주론의 기본"},
  eds:{n:"아인슈타인 · 드 지터",y:"1932",d:"우주가 딱 기준 밀도(임계밀도)만큼이라 평평하다는 모형을 함께 내놓았어요.",c:"우주는 딱 기준 밀도만큼이라 평평하고, 미는 힘은 없다",t:"아인슈타인과 드 지터는 가장 단순한 우주를 내놓았어요. 미는 힘은 없고, 물질은 딱 임계밀도만큼 있어서 공간이 평평한 우주예요. 이 우주는 영원히 커지지만 중력 때문에 점점 느려져요. 수십 년 동안 기본 모형으로 쓰였는데, 1998년 우주가 오히려 빨라지고 있다는 것이 발견되면서 미는 힘이 다시 더해졌어요.",v:"평평함은 맞음 · '미는 힘 없음'은 틀림"},
  b2fh:{n:"버비지 부부 · 파울러 · 호일",y:"1957",d:"탄소, 산소, 철 같은 무거운 원소는 별과 초신성이 만든다는 것을 밝혔어요.",c:"탄소, 산소, 철 같은 원소는 별과 초신성이 만든다",t:"네 과학자는 수소와 헬륨보다 무거운 원소가 어디서 왔는지 정리했어요. 별 속에서 헬륨이 합쳐져 탄소와 산소가 되고, 무거운 별 속에서 차례로 더 무거운 원소가 생겨 철까지 만들어져요. 금처럼 더 무거운 원소는 초신성 폭발 같은 엄청난 사건에서 생겨요. 별이 죽으며 뿌린 원소가 모여 행성과 우리 몸이 됐어요. 그래서 '우리는 별의 먼지'라고 해요.",v:"사실로 확인됨"},
  lemaitre:{n:"조르주 르메트르",y:"1927 · 1931",d:"우주가 팽창하고 있고, 처음엔 작은 '원시 원자'였다고 처음 주장한 신부이자 과학자예요.",c:"우주는 팽창하고 있고, 처음엔 작은 '원시 원자'였다",t:"벨기에의 신부이자 물리학자 르메트르는 1927년, 은하들이 멀어지는 자료와 아인슈타인의 식을 함께 보고 우주가 커지고 있다고 주장했어요. 허블보다 2년 먼저예요. 1931년에는 시간을 거꾸로 돌리면 우주가 아주 작은 '원시 원자'에서 시작했을 거라고 했어요. 이것이 빅뱅 이론의 출발점이에요.",v:"사실로 확인됨"},
  hubble:{n:"에드윈 허블",y:"1929",d:"멀리 있는 은하일수록 더 빨리 멀어진다는 것을 망원경으로 확인했어요.",c:"멀리 있는 은하일수록 더 빨리 멀어진다",t:"허블은 큰 망원경으로 먼 은하까지의 거리와, 빛이 붉게 늘어난 정도(멀어지는 속도)를 쟀어요. 그랬더니 멀리 있는 은하일수록 더 빨리 멀어지고 있었어요. 우주 전체가 고르게 커지고 있다는 증거예요. 다만 처음 잰 팽창 속도는 약 500으로 지금 값(약 70)보다 7배나 커서, 우주 나이가 지구보다 어리게 나오는 문제가 있었어요. 나중에 거리를 잘못 잰 것이 밝혀져 고쳐졌어요.",v:"팽창 발견은 맞음 · 숫자는 고쳐짐"},
  steady:{n:"호일 · 본디 · 골드",y:"1948",d:"우주는 커지지만 새 물질이 생겨나 늘 같은 모습이라는 '정상우주론'을 주장했어요.",c:"우주는 커지지만 새 물질이 생겨나 늘 같은 모습이다(정상우주론)",t:"세 과학자는 우주에 시작이 있다는 생각이 마음에 들지 않았어요. 그래서 은하들이 멀어져 생긴 빈 곳에 새 물질이 저절로 조금씩 생겨나, 우주가 언제나 같은 모습이라고 주장했어요. 시작도 끝도 없는 우주예요. 하지만 빅뱅의 남은 빛이 발견되고, 먼 옛날 우주가 지금과 다르게 생겼다는 관측이 쌓이면서 지금은 받아들여지지 않아요.",v:"틀린 것으로 밝혀짐"},
  einstein:{n:"알베르트 아인슈타인",y:"1917",d:"우주가 움직이지 않게 하려고 식에 '우주상수 Λ'를 넣었어요.",c:"우주는 변하지 않는다. 그러니 밀어내는 힘 Λ가 필요하다",t:"아인슈타인이 자신의 중력 식을 우주 전체에 적용하니, 중력은 끌어당기기만 해서 우주가 무너져야 했어요. 당시엔 모두 우주가 변하지 않는다고 믿었기 때문에, 빈 공간이 밀어내는 힘인 '우주상수 Λ(람다)'를 식에 넣어 중력과 딱 맞서게 했어요. 하지만 이 균형은 연필을 끝으로 세운 것처럼 조금만 흔들려도 무너져요.",v:"멈춘 우주는 틀림 · Λ는 나중에 다시 돌아옴"},

  if(s.M>70)o.push("물질이 넘쳐나고");

function pickEnding(s,f){

  if(f.stat)return E("static");
  if((s.L<=35&&s.D>=54)||(s.L<=70&&s.D>=72))return E("crunch");

  addEventListener("resize",resize);resize();
  const lerp=(a,b,t)=>a+(b-a)*t;
  function frame(now){
    const t=(now-t0)/1000;const k=reduce?1:0.035;
    for(const key of ["sc","cl","j","a","cnt"])cur[key]=lerp(cur[key],tgt[key]??0,k);
    cur.col=cur.col.map((v,i)=>lerp(v,tgt.col[i],k));cur.bg=cur.bg.map((v,i)=>lerp(v,tgt.bg[i],k));
    const [bh,bs,bl]=cur.bg;
    const g=cx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75);
    g.addColorStop(0,`hsl(${bh} ${bs}% ${bl+4}%)`);g.addColorStop(1,`hsl(${bh} ${bs}% ${Math.max(1,bl-2)}%)`);
    cx.fillStyle=g;cx.fillRect(0,0,W,H);
    if(tgt.fog){cx.fillStyle=`hsla(${cur.col[0]} 80% 50% / .06)`;for(let i=0;i<6;i++){const x=W*(.5+.4*Math.sin(t*.07+i*1.7)),y=H*(.5+.4*Math.cos(t*.05+i*2.3));const rg=cx.createRadialGradient(x,y,0,x,y,Math.max(W,H)*.4);rg.addColorStop(0,`hsla(${cur.col[0]} 90% 55% / .14)`);rg.addColorStop(1,"transparent");cx.fillStyle=rg;cx.fillRect(0,0,W,H)}}
    const R=Math.min(W,H)*.5*cur.sc,cxm=W/2,cym=H/2;
    const [h,s,l]=cur.col;const pul=pulseT>0?pulseT:0;
    const n=Math.floor(N*Math.min(1,cur.cnt));
    for(let i=0;i<n;i++){const p=P[i];
      const x0=lerp(p.ux,p.cx,cur.cl),y0=lerp(p.uy,p.cy,cur.cl);
      const jx=Math.sin(t*3+p.ph*7)*cur.j*.02,jy=Math.cos(t*2.7+p.ph*5)*cur.j*.02;
      let x=cxm+(x0+jx)*R*(W>H?W/H:1)*.95,y=cym+(y0+jy)*R;
      const tw=tgt.tw?.55+.45*Math.sin(t*2+p.ph*3):1;
      const r=(0.6+p.sz*1.6)*(1+pul*1.5);
      cx.fillStyle=`hsla(${h+(p.sz-.5)*20} ${s}% ${l}% / ${cur.a*tw})`;
      cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();
      if(tgt.flash&&Math.random()<.004){cx.fillStyle="rgba(255,255,255,.9)";cx.beginPath();cx.arc(x,y,r*4,0,6.283);cx.fill()}
    }
    if(tgt.holes){for(let i=0;i<CL.length;i++){const c=CL[i];const x=cxm+c.x*R*(W>H?W/H:1)*.95,y=cym+c.y*R;const rr=R*.05;
      const rg=cx.createRadialGradient(x,y,rr*.8,x,y,rr*2.6);rg.addColorStop(0,"rgba(255,170,80,.55)");rg.addColorStop(1,"transparent");cx.fillStyle=rg;cx.beginPath();cx.arc(x,y,rr*2.6,0,6.283);cx.fill();
      cx.fillStyle="#000";cx.beginPath();cx.arc(x,y,rr,0,6.283);cx.fill()}}
    if(tgt.wipe){wipeT=Math.min(1,wipeT+.004);const rr=Math.max(W,H)*1.2*wipeT;cx.strokeStyle="rgba(255,150,240,.8)";cx.lineWidth=3;cx.beginPath();cx.arc(W*.8,H*.25,rr,0,6.283);cx.stroke();cx.fillStyle="rgba(40,0,40,.55)";cx.fill()}
    if(pulseT>0)pulseT=Math.max(0,pulseT-.03);
    // readable scrim
    cx.fillStyle="rgba(7,6,11,.28)";cx.fillRect(0,0,W,H);
    if(!reduce||!frame.once){frame.once=1;requestAnimationFrame(frame)}
  }
  requestAnimationFrame(frame);
  return{mode(m){tgt=M[m]||M.title;if(m!=="vacuum")wipeT=0;if(reduce)requestAnimationFrame(frame)},pulse(){pulseT=1}};
})();

// ---------- 시작 ----------
function boot(data){if(data&&data.st&&data.st.phase!=="end")st=data.st;render()}
try{window.claude?.hot?.snapshot?.(()=>({st}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
})();
</script>
